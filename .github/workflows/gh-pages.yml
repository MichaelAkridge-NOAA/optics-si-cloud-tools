name: Build and Deploy Codelabs to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Install claat tool
        run: |
          git clone https://github.com/googlecodelabs/tools.git /tmp/codelabs-tools
          cd /tmp/codelabs-tools/claat
          go install
          export PATH=$PATH:$(go env GOPATH)/bin
      - name: Build Codelabs
        run: |
          set -e
          # Prevent GitHub Pages from running docs/ through Jekyll, which mangles {{ }} / {% %} in code samples
          touch docs/.nojekyll
          find docs/codelabs -mindepth 1 ! -path 'docs/codelabs/assets*' -exec rm -rf {} +
          mkdir -p docs/codelabs/assets
          echo "claat help:" && claat -h | head -n 1 || true
          echo "Building codelabs..."
          claat export -o docs/codelabs codelabs/*.md
          echo "Codelabs output:"
          tree docs/codelabs || true
      - name: Patch HTML with scripts and Commit
        run: |
          # claat-public bucket is dead (billing disabled); rehost assets on jsDelivr.
          # codelab-elements.js is ES5/Closure-compiled and needs the ES5 custom-elements
          # adapter (in place of the old native-shim.js) or native browsers throw
          # "Failed to construct 'HTMLElement': Please use the 'new' operator".
          find docs/codelabs -name index.html | while read f; do
            sed -i \
              -e 's#https://storage\.googleapis\.com/claat-public/codelab-elements\.css#https://cdn.jsdelivr.net/npm/codelab-elements@1.0.1/codelab-elements.css#g' \
              -e 's#https://storage\.googleapis\.com/claat-public/native-shim\.js#https://cdn.jsdelivr.net/npm/@webcomponents/webcomponentsjs@2.8.0/custom-elements-es5-adapter.js#g' \
              -e '/https:\/\/storage\.googleapis\.com\/claat-public\/custom-elements\.min\.js/d' \
              -e 's#https://storage\.googleapis\.com/claat-public/prettify\.js#https://cdn.jsdelivr.net/npm/google-code-prettify@1.0.5/src/prettify.js#g' \
              -e 's#https://storage\.googleapis\.com/claat-public/codelab-elements\.js#https://cdn.jsdelivr.net/npm/codelab-elements@1.0.1/codelab-elements.js#g' \
              "$f"
          done
          find docs/codelabs -name index.html | while read f; do
            tmpfile=$(mktemp)
            awk '
              /<\/body>/ {
                print "<script src=\"/optics-si-cloud-tools/codelabs/assets/close-button-patch.js\"></script>"
                print "<script src=\"/optics-si-cloud-tools/codelabs/assets/copy-code-button.js\"></script>"
              }
              { print }
            ' "$f" > "$tmpfile" && mv "$tmpfile" "$f"
          done
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/codelabs docs/.nojekyll
          git commit -m "chore: update built codelabs [skip ci]" || echo "No changes to commit"
          git push

